name: Manual Trigger

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level (INFO/DEBUG)'
        required: false
        default: 'INFO'
      skip_deploy:
        description: 'Skip deployment to Pages (dry run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  manual-collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install Python dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector (manual trigger)
        id: collect
        # set +e: 采集失败也不中断，便于查看完整日志诊断
        run: |
          set +e
          mkdir -p collector/logs docs/data
          python -u collector/main.py 2>&1 | tee collector/logs/collect_run.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "collector_exit=$EXIT_CODE"
          echo "=== Collector log (tail 80) ==="
          tail -n 80 collector/logs/collect_run.log
          echo "=== End log ==="
          exit 0
        env:
          PYTHONUNBUFFERED: 1
          LOG_LEVEL: "${{ inputs.log_level }}"
          # Disable local Clash proxy in GitHub Actions cloud environment
          MLLM_PROXY: ""

      - name: Show collection results
        run: |
          echo "=== Collection Results ==="
          if [ -f docs/data/today_stats.json ]; then
            cat docs/data/today_stats.json
          else
            echo "No stats file generated"
          fi

      - name: Commit JSON data updates
        run: |
          git config --local user.email "mllm-bot@github.com"
          git config --local user.name "MLLM Security Bot"
          git add docs/data/all_news.json docs/data/index.json docs/data/latest.json docs/data/today_stats.json
          git add docs/data/archive
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): manual collection update $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress
        run: npm run docs:build

      - name: Deploy to GitHub Pages
        if: "${{ !inputs.skip_deploy }}"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'MLLM Security Bot'
          user_email: 'mllm-bot@github.com'
          commit_message: "deploy: manual update $(date +%Y-%m-%d)"
