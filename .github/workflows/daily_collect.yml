name: Daily Collection + Deploy

on:
  schedule:
    # Run daily at UTC 02:00 (Beijing 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level (INFO/DEBUG)'
        required: false
        default: 'INFO'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      # Step 3: Install Python dependencies
      - name: Install Python dependencies
        run: |
          pip install -r collector/requirements.txt
          # Only install playwright browser for web_scraper sources
          # Currently web_scraper uses requests+bs4, so playwright is optional

      # Step 4: Run collector
      - name: Run MLLM Security Daily Collector
        id: collect
        run: |
          mkdir -p collector/logs docs/data
          python collector/main.py 2>&1 | tee collector/logs/collect_run.log
        env:
          PYTHONUNBUFFERED: 1
          LOG_LEVEL: "${{ inputs.log_level }}"
          # Disable local Clash proxy in GitHub Actions cloud environment
          MLLM_PROXY: ""

      # Step 5: Show collection results
      - name: Show collection summary
        run: |
          echo "=== Collection Results ==="
          if [ -f docs/data/today_stats.json ]; then
            cat docs/data/today_stats.json
          else
            echo "No stats file generated"
          fi
          echo ""
          echo "=== docs/data/ content ==="
          ls -la docs/data/

      # Step 6: Commit and push data changes
      - name: Commit JSON data updates
        run: |
          git config --local user.email "mllm-bot@github.com"
          git config --local user.name "MLLM Security Bot"
          # Commit all sharded data: index / latest / stats / monthly archive
          git add docs/data/all_news.json docs/data/index.json docs/data/latest.json docs/data/today_stats.json
          git add docs/data/archive
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): daily collection update $(date +'%Y-%m-%d')"
            git push
          fi

      # Step 7: Set up Node.js for VitePress build
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 8: Install Node.js dependencies
      - name: Install dependencies
        run: npm ci

      # Step 9: Build VitePress site
      - name: Build VitePress
        run: npm run docs:build

      # Step 10: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'MLLM Security Bot'
          user_email: 'mllm-bot@github.com'
          commit_message: "deploy: site update $(date +%Y-%m-%d)"
