# MLLM Security Daily - Data Source Configuration
# Each source is auto-collected on every run.

sources:

  # ===== arXiv API Queries =====
  - name: "arXiv MLLM+Backdoor"
    type: arxiv_api
    endpoint: "http://export.arxiv.org/api/query"
    params:
      search_query: "all:multimodal+AND+all:backdoor"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 3
    category: 学术论文
    enabled: true

  - name: "arXiv VLM+Backdoor"
    type: arxiv_api
    endpoint: "http://export.arxiv.org/api/query"
    params:
      search_query: "all:vision-language+AND+all:backdoor"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 3
    category: 学术论文
    enabled: true

  - name: "arXiv MLLM+Safety"
    type: arxiv_api
    endpoint: "http://export.arxiv.org/api/query"
    params:
      search_query: "all:multimodal+AND+all:safety+AND+all:llm"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 3
    category: 学术论文
    enabled: true

  - name: "arXiv MLLM+Jailbreak"
    type: arxiv_api
    endpoint: "http://export.arxiv.org/api/query"
    params:
      search_query: "all:multimodal+AND+all:jailbreak"
      max_results: 100
      sortBy: submittedDate
