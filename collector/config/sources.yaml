# MLLM Security Daily - Data Source Configuration (DOMESTIC-FRIENDLY)
# 重构：以安全领域为核心，arXiv 查询改用标题字段 ti: 收窄范围，
# RSS/爬虫源通过 keyword_matcher.filter_safe 统一过滤

sources:

  # ===== arXiv API =====
  # 所有 arXiv 查询改用 ti: 标题字段，避免全字段 all: 误命中
  # 注意：arXiv 源的 interval 设为 17 秒 + 共享限流 key（见 network.py），
  # 所有源串行发出，避免触发 API 429 限流。
  - name: "arXiv MLLM+Backdoor"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:multimodal+AND+ti:backdoor"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv VLM+Backdoor"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:vision-language+AND+ti:backdoor"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv MLLM+Safety"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:multimodal+AND+ti:safety"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv MLLM+Jailbreak"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:multimodal+AND+ti:jailbreak"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv VLM+Adversarial"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:VLM+AND+ti:adversarial"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv VLM+Safety"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:vision-language+AND+ti:safety"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv MLLM+Robustness"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:multimodal+AND+ti:robustness"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv+Trustworthy"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "ti:multimodal+AND+ti:trustworthy"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  # ===== RSS Feeds & Web Scrape (company blogs & communities) =====
  # 这些源抓取全部文章，但在 keyword_matcher.filter_safe 中会过滤掉非安全内容

  - name: "Foretellix CTO Blog - AI Safety"
    type: rss
    feed_url: "https://blog.foretellix.com/feed/"
    interval: 5
    category: 官方新闻
    enabled: true

