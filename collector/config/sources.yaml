# MLLM Security Daily - Data Source Configuration (DOMESTIC-FRIENDLY)
# 重构：以安全领域为核心，arXiv 查询改用标题字段 ti: 收窄范围，
# RSS/爬虫源通过 keyword_matcher.filter_safe 统一过滤

sources:

  # ===== arXiv API =====
  # arXiv 查询使用全字段（默认），扩大召回；本地以 safety_filter 精筛到 AI 安全方向。
  # interval=17s + 共享限流 key（network.py），所有源串行发出避免 429。
  - name: "arXiv Backdoor-Generic"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:backdoor"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv Data-Poisoning"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:data+poisoning"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv Multimodal-Adversarial"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:multimodal+AND+all:adversarial"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv LLM-Jailbreak"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:llm+jailbreak"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv LLM-AI-Safety"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:LLM+AI+safety"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv Alignment-Unlearning"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:alignment+OR+all:unlearning"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv Embodied-Robot-Safety"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:embodied+AI+safety"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  - name: "arXiv Test-time-LLM-Safety"
    type: arxiv_api
    endpoint: "https://export.arxiv.org/api/query"
    params:
      search_query: "all:test-time+attack+OR+all:safety+RL"
      max_results: 100
      sortBy: submittedDate
      sortOrder: descending
    interval: 17
    category: 学术论文
    enabled: true

  # ===== RSS Feeds & Web Scrape (company blogs & communities) =====
  # trusted: true 表示精选受信源（方向明确），采集时不强制关键词过滤，
  # 仅靠日期过滤 + dedup 控制；其余(arXiv)仍按 is_safe 过滤

  - name: "Foretellix CTO Blog - AI Safety"
    type: rss
    feed_url: "https://blog.foretellix.com/feed/"
    interval: 5
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "OpenAI Blog"
    type: rss
    feed_url: "https://openai.com/blog/news.xml"
    interval: 5
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "Microsoft Research"
    type: rss
    feed_url: "https://www.microsoft.com/en-us/research/feed/"
    interval: 5
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "DeepSeek Blog"
    type: web_scrape
    page_url: "https://www.deepseek.com/blogs/"
    interval: 10
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "机器之心 - 最新文章"
    type: rss
    feed_url: "https://www.jiqizhixin.com/rss"
    interval: 10
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "智源社区 - 最新文章"
    type: web_scrape
    page_url: "https://hub.baai.ac.cn/"
    interval: 15
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "阿里云 Qwen 团队 Blog"
    type: web_scrape
    page_url: "https://qwenlm.github.io/blog/"
    interval: 10
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "BAAI 智源研究院 - 新闻"
    type: web_scrape
    page_url: "https://www.baai.ac.cn/portal/list/index/id/3.html"
    interval: 15
    category: 官方新闻
    trusted: true
    enabled: true

  - name: "Hugging Face Blog (via HF Mirror)"
    type: rss
    feed_url: "https://hf-mirror.com/blog/feed.xml"
    interval: 5
    category: 开源发布
    trusted: true
    enabled: true

  - name: "Hugging Face Papers (via HF Mirror)"
    type: rss
    feed_url: "https://hf-mirror.com/papers/feed"
    interval: 5
    category: 学术论文
    trusted: true
    enabled: true